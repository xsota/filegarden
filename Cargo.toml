[package]
name = "filegarden"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
description = "Watch your code grow — a real-time file activity visualizer for the terminal"
license = "MIT"
repository = "https://github.com/xsota/filegarden"
readme = "README.md"
keywords = ["tui", "file-watcher", "visualizer", "ratatui", "terminal"]
categories = ["command-line-utilities", "visualization"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4.38", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
globset = "0.4"
notify = "7"
ratatui = "0.29"
thiserror = "2"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
